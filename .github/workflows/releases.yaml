name: Release publication

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: numclick.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}